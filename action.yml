name: agentmeld
description: "Keep one canonical copy of your AI instructions, rules, skills, agents, commands and MCP config, mirrored to every AI tool."
branding:
  icon: link
  color: purple
inputs:
  args:
    description: Arguments passed to the agentmeld CLI.
    required: false
    default: sync --check
  version:
    description: "Version of agentmeld to install (default: latest release)."
    required: false
    default: ""
  working-directory:
    description: Directory to run in.
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Install agentmeld
      shell: bash
      env:
        REQUESTED_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "${REQUESTED_VERSION}" ]; then
          python3 -m pip install --quiet --upgrade "agentmeld==${REQUESTED_VERSION}"
        elif python3 -m pip install --quiet --upgrade agentmeld; then
          : # released on PyPI
        else
          # Not published yet (or PyPI unreachable): fall back to this repository,
          # so the action works before the first release rather than failing with
          # a confusing "no matching distribution" error.
          echo "agentmeld not installable from PyPI; installing from ${GITHUB_ACTION_REPOSITORY:-moneytool/agentmeld}" >&2
          python3 -m pip install --quiet \
            "git+https://github.com/${GITHUB_ACTION_REPOSITORY:-moneytool/agentmeld}"
        fi
    - name: Run agentmeld
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: agentmeld ${{ inputs.args }}
