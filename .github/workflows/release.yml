name: Release

on:
  push:
    # Semver tags only. "v*" also matched the moving `v1` tag used to pin the
    # GitHub Action, so re-pointing it re-ran a publish of whatever version
    # happened to be in pyproject.toml.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing: no API token stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
