name: Tag release on main merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v') &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Read package version from main
        id: version
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("src/agentmeld/__init__.py").read_text(encoding="utf-8")
          match = re.search(r'__version__ = "(\d+\.\d+\.\d+)"', text)
          if match is None:
              raise SystemExit("missing __version__")
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate release branch/version agreement
        env:
          RELEASE_BRANCH: ${{ github.event.pull_request.head.ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          expected="release/v${VERSION}"
          if [ "$RELEASE_BRANCH" != "$expected" ]; then
            echo "::error::release branch $RELEASE_BRANCH does not match expected $expected"
            exit 1
          fi

      - name: Create and push semver tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${MERGE_SHA}" origin/main; then
            echo "::error::merge commit ${MERGE_SHA} is not in main history"
            exit 1
          fi
          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" "${MERGE_SHA}" -m "Release ${tag}"
          git push origin "${tag}"
